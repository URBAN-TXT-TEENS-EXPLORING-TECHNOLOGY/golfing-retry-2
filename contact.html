<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <img class="logo" src="assets/logo.png" alt="Golfing Retry 2 logo" />
    <nav class="site-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="coaching.html">Coaching</a><a href="about.html">About Us</a><a href="contact.html" aria-current="page">Contact</a></nav>
  </header>
  <section class="hero hero-bleed" id="hero">
      <img src="assets/hero.jpg" alt="Golfing Retry 2 hero" />
      <div class="hero-overlay">
        <h1>Golfing Retry 2</h1>
        
        
      </div>
    </section>
    <section class="content-section contact" id="contact">
      <h2>Contact Us</h2>
      <div class="contact-details"></div>
      <form class="contact-form" data-txt-mock="contact">
        <label>Name <input type="text" name="name" required /></label>
        <label>Email <input type="email" name="email" required /></label>
        <label>Message <textarea name="message" rows="4" required></textarea></label>
        <button type="submit" class="btn btn-primary">Send</button>
      </form>
    </section>
    <footer id="footer"><p>&copy; 2026 Golfing Retry 2</p></footer>
  <script src="mock-interactions.js"></script>
  <script src="main.js"></script>
</body>
</html>
